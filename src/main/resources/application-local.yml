spring:
  datasource:
    url: jdbc:h2:mem:vyapaarsathi;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  gemini:
    api-key: "${GEMINI_API_KEY:}"
